services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: kaption-cpu:local
    init: true
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      KAPTION_TRANSLATION_BACKEND: llama-cpp
      KAPTION_CPU_THREADS: '4'
      KAPTION_MAX_ACTIVE_JOBS: '2'
      KAPTION_STT_MODEL: small
      KAPTION_STT_DEVICE: cpu
      KAPTION_STT_COMPUTE_TYPE: int8
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - type: bind
        source: ./models/koreanlm-4bit
        target: /models/koreanlm-4bit
        read_only: true
        bind:
          create_host_path: false
      - jobs:/data
      - model-cache:/cache/huggingface
    cpus: 4.0
    mem_limit: 7g
    stop_grace_period: 10m

volumes:
  jobs:
  model-cache:
